name: Debug remote tests

# 临时调试用：只跑 vofa_remote_tests，并把 QtTest 的输出写到文件后打印，
# 即使进程崩溃也能看到已经跑了哪些用例。用完即删。
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_VERSION: '6.8.3'
      QT_ARCH: win64_mingw
      QT_DIR: C:\Qt
      BUILD_DIR: build-win

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          modules: 'qtserialport'
          tools: 'tools_mingw1310'
          cache: true
          dir: ${{ env.QT_DIR }}

      - name: Resolve MinGW toolchain
        shell: pwsh
        run: |
          # 统一用 Qt 官方配套的 GCC 13.1，避免和 runner 自带 MinGW 混用
          # 导致链接 Qt 库时出现 ABI 问题。
          $bin = Get-ChildItem "$env:QT_DIR\Tools" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like '*mingw*' } |
            ForEach-Object { Join-Path $_.FullName 'bin' } |
            Where-Object { Test-Path (Join-Path $_ 'g++.exe') } |
            Select-Object -First 1

          if (-not $bin) {
            Write-Host '::warning::install-qt-action 没带上工具链，回退到 aqt install-tool'
            python -m pip install --quiet aqtinstall
            python -m aqt install-tool windows desktop tools_mingw1310 --outputdir $env:QT_DIR
            $bin = Get-ChildItem "$env:QT_DIR\Tools" -Directory |
              ForEach-Object { Join-Path $_.FullName 'bin' } |
              Where-Object { Test-Path (Join-Path $_ 'g++.exe') } |
              Select-Object -First 1
          }
          if (-not $bin) { throw 'MinGW toolchain not found' }

          "MINGW_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin 'g++.exe') --version | Select-Object -First 1

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B $env:BUILD_DIR -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_C_COMPILER="$env:MINGW_BIN\gcc.exe" `
            -DCMAKE_CXX_COMPILER="$env:MINGW_BIN\g++.exe" `
            -DVOFA_VERSION="0.1.debug" `
            -DVOFA_BUILD_APP=ON `
            -DVOFA_BUILD_TESTS=ON `
            -DVOFA_BUILD_BENCH=OFF

      - name: Build remote tests
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --target vofa_remote_tests

      - name: Run with output file
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = "$env:BUILD_DIR\vofa_remote_tests.exe"
          & $exe -o remote-debug.txt,txt -v1
          Write-Host "exit code: $LASTEXITCODE"
          if (Test-Path remote-debug.txt) {
            Write-Host '----- remote-debug.txt -----'
            Get-Content remote-debug.txt
          } else {
            Write-Host 'no output file produced'
          }

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-debug
          path: remote-debug.txt
          if-no-files-found: warn
