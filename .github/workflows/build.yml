name: Build & Release

# 每次推送到 main 都会重新构建，并把产物覆盖到滚动 Release（tag: latest）；
# 推 v* 标签则发布正式 Release。下载地址固定不变，历史构建可从 Actions 的
# artifact 里取（保留 14 天）。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'
  QT_ARCH: win64_mingw
  QT_DIR: C:\Qt
  BUILD_DIR: build-win

jobs:
  build:
    name: Windows / MinGW
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }} (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          # qtserialport 不在 win64_mingw 的基础包里，必须单独装，
          # 否则 CMake 的 find_package(Qt6 COMPONENTS SerialPort) 会失败。
          modules: 'qtserialport'
          tools: 'tools_mingw1310'
          cache: true
          dir: ${{ env.QT_DIR }}

      - name: Resolve MinGW toolchain
        shell: pwsh
        run: |
          # 统一用 Qt 官方配套的 GCC 13.1，避免和 runner 自带 MinGW 混用
          # 导致链接 Qt 库时出现 ABI 问题。
          $bin = Get-ChildItem "$env:QT_DIR\Tools" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like '*mingw*' } |
            ForEach-Object { Join-Path $_.FullName 'bin' } |
            Where-Object { Test-Path (Join-Path $_ 'g++.exe') } |
            Select-Object -First 1

          if (-not $bin) {
            Write-Host '::warning::install-qt-action 没带上工具链，回退到 aqt install-tool'
            python -m pip install --quiet aqtinstall
            python -m aqt install-tool windows desktop tools_mingw1310 --outputdir $env:QT_DIR
            $bin = Get-ChildItem "$env:QT_DIR\Tools" -Directory |
              ForEach-Object { Join-Path $_.FullName 'bin' } |
              Where-Object { Test-Path (Join-Path $_ 'g++.exe') } |
              Select-Object -First 1
          }
          if (-not $bin) { throw 'MinGW toolchain not found' }

          "MINGW_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin 'g++.exe') --version | Select-Object -First 1

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B $env:BUILD_DIR -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_C_COMPILER="$env:MINGW_BIN\gcc.exe" `
            -DCMAKE_CXX_COMPILER="$env:MINGW_BIN\g++.exe" `
            -DVOFA_BUILD_APP=ON `
            -DVOFA_BUILD_TESTS=ON `
            -DVOFA_BUILD_BENCH=OFF

      - name: Build
        shell: pwsh
        run: cmake --build $env:BUILD_DIR

      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir $env:BUILD_DIR --output-on-failure

      - name: Deploy (windeployqt + trim)
        shell: pwsh
        run: |
          # 与 scripts/build_windows.bat 的部署/裁剪步骤保持一致。
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "$env:BUILD_DIR\vofa2_app.exe" dist\

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --compiler-runtime `
            --qmldir src\app dist\vofa2_app.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed ($LASTEXITCODE)" }

          foreach ($dir in 'qmltooling', 'translations') {
            if (Test-Path "dist\$dir") { Remove-Item "dist\$dir" -Recurse -Force }
          }
          if (Test-Path 'dist\opengl32sw.dll') { Remove-Item 'dist\opengl32sw.dll' -Force }
          foreach ($style in 'Fusion', 'Material', 'Universal', 'Imagine', 'Windows', 'FluentWinUI3') {
            $p = "dist\qml\QtQuick\Controls\$style"
            if (Test-Path $p) { Remove-Item $p -Recurse -Force }
          }
          foreach ($mod in 'Dialogs', 'Effects', 'LocalStorage', 'Particles', 'VectorImage', 'tooling') {
            $p = "dist\qml\QtQuick\$mod"
            if (Test-Path $p) { Remove-Item $p -Recurse -Force }
          }
          Get-ChildItem dist -Filter 'Qt6QuickControls2*.dll' | Where-Object {
            $_.Name -match '(Fusion|Material|Universal|Imagine|WindowsStyleImpl|FluentWinUI3StyleImpl)'
          } | Remove-Item -Force
          if (Test-Path 'dist\Qt6QuickEffects.dll') { Remove-Item 'dist\Qt6QuickEffects.dll' -Force }

          # 运行时 DLL 缺一个，用户那边就是「双击没反应」，这里直接失败。
          $missing = @('libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll') |
            Where-Object { -not (Test-Path "dist\$_") }
          if ($missing) { throw "部署缺少运行库: $($missing -join ', ')" }
          Write-Host "dist entries: $((Get-ChildItem dist).Count)"

      - name: Smoke test deployed build
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # 用 ProcessStartInfo 而非 Start-Process：后者会把环境变量塞进字典，
          # 遇到大小写重名的变量（HTTP_PROXY/https_proxy）会直接抛异常。
          $exe = (Resolve-Path 'dist\vofa2_app.exe').Path
          $psi = [System.Diagnostics.ProcessStartInfo]::new($exe)
          $psi.UseShellExecute = $false
          $psi.WorkingDirectory = (Get-Location).Path
          $proc = [System.Diagnostics.Process]::Start($psi)

          Start-Sleep -Seconds 6
          if ($proc.HasExited) {
            throw "vofa2_app.exe 启动后立即退出（exit code $($proc.ExitCode)），多半是缺 DLL"
          }
          try { $proc.Kill() } catch { }
          Write-Host '应用启动 6 秒未退出，部署自洽。'

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath VOFA2-win64.zip -Force
          Write-Host "zip: $([math]::Round((Get-Item VOFA2-win64.zip).Length / 1MB, 1)) MB"

      - name: Build installer (Inno Setup)
        shell: pwsh
        continue-on-error: true
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }
          & $iscc installer\vofa2.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem installer\output\*-setup.exe |
            Select-Object -First 1 |
            Copy-Item -Destination VOFA2-setup.exe -Force

      - name: Compose release notes
        shell: pwsh
        run: |
          # 微软 cmdlet 读到的 native 输出默认按系统代码页解码，中文 commit
          # 说明会变成乱码，这里强制 UTF-8。
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)

          $repo = '${{ github.repository }}'
          $sha = '${{ github.sha }}'
          $short = $sha.Substring(0, 7)
          $subject = (git log -1 --pretty=%s)
          $actor = '${{ github.actor }}'
          $qt = '${{ env.QT_VERSION }}'

          if ('${{ startsWith(github.ref, 'refs/tags/v') }}' -eq 'true') {
            $head = "**${{ github.ref_name }}** — 正式版本"
            $foot = '> 正式版本发布，资产一般不再变化。'
          } else {
            $head = '**滚动构建 (latest)** — 每次推送到 main 都会重新构建并覆盖本页资产'
            $foot = "> 下载链接恒定不变。需要历史构建请到 [Actions](https://github.com/$repo/actions/workflows/build.yml) 下载对应的 artifact（保留 14 天）。"
          }

          # 用数组 + join 拼正文，不依赖 here-string 的换行处理。
          $lines = @(
            $head
            ''
            '| 项目 | 值 |'
            '| --- | --- |'
            "| 提交 | [$short](https://github.com/$repo/commit/$sha) |"
            "| 提交说明 | $subject |"
            "| 触发者 | @$actor |"
            "| 构建环境 | Qt $qt / MinGW 64-bit |"
            ''
            '## 下载'
            ''
            '- **VOFA2-win64.zip** — 免安装便携版。解压后双击 `vofa2_app.exe` 即可；'
            '  想让配置随目录走（U 盘、绿色版），在 exe 同级放一个空文件 `portable`。'
            '- **VOFA2-setup.exe** — 安装包，按当前用户安装，不需要管理员权限。'
            '  若本次构建 Inno Setup 出错，则只有 zip。'
            ''
            $foot
          )
          $lines -join "`n" | Set-Content -Path release_body.md -Encoding utf8
          Get-Content release_body.md | Select-Object -First 12

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VOFA2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            VOFA2-win64.zip
            VOFA2-setup.exe

      - name: Drop stale installer asset
        # 这次没产出安装包时，把滚动 Release 里上一次的旧安装包删掉，
        # 免得「新 zip + 旧 exe」被误当成同一次构建。
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path VOFA2-setup.exe)) {
            gh release delete-asset latest VOFA2-setup.exe --yes
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # 普通提交写滚动更新的 latest；推 v* 标签则走正式版本。
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '最新构建 (latest)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          fail_on_unmatched_files: false
          body_path: release_body.md
          files: |
            VOFA2-win64.zip
            VOFA2-setup.exe
